[build]
  command = "npm run build"
  publish = "dist"

# Built from netlify/src by `npm run build` (scripts/build-functions.mjs).
[functions]
  directory = "netlify/functions"

# The report's fonts and images travel with the function that draws it.
[functions.send-report]
  # pdfkit loads its built-in fonts (and their shared chunks) by name, which
  # the bundler cannot see, so its whole js folder ships too.
  included_files = ["public/report/fonts/*.woff", "public/report/*.png", "public/report/*.jpg", "node_modules/pdfkit/js/**"]

# Not-found pages are served from src/pages/404.astro (dist/404.html), which
# Netlify picks up automatically. This is a static site: no SPA catch-all.

# ---- Old Lovable routes ----

# The nørma demo, pilot and ROI pages now live on joinnorma.com.
[[redirects]]
  from = "/norma-demo"
  to = "https://joinnorma.com/"
  status = 301
  force = true

[[redirects]]
  from = "/norma-demo/*"
  to = "https://joinnorma.com/"
  status = 301
  force = true

[[redirects]]
  from = "/pilot"
  to = "https://joinnorma.com/book-a-demo/"
  status = 301
  force = true

[[redirects]]
  from = "/norma-us-pilot"
  to = "https://joinnorma.com/book-a-demo/"
  status = 301
  force = true

# Includes /demo/salesforce, which the old site sent to /norma-demo.
[[redirects]]
  from = "/demo"
  to = "https://joinnorma.com/"
  status = 301
  force = true

[[redirects]]
  from = "/demo/*"
  to = "https://joinnorma.com/"
  status = 301
  force = true

[[redirects]]
  from = "/cost-of-status-quo"
  to = "https://joinnorma.com/roi/"
  status = 301
  force = true

# Route alias from the old App.tsx (both addresses showed the same page).
[[redirects]]
  from = "/build-a-human-strategy"
  to = "/human-strategy"
  status = 301
  force = true

# ---- Headers ----

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Email signatures: the copy pages and the images every email links to (made
# by tools/signature/make-assets.mjs in the nørma website repo). Kept out of
# search.
[[headers]]
  for = "/signature/*"
  [headers.values]
    X-Robots-Tag = "noindex"
